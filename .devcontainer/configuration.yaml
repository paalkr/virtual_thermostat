homeassistant:
  name: Test Home
  unit_system: metric
  time_zone: Europe/Oslo

http:

frontend:

api:

logger:
  default: info
  logs:
    custom_components.virtual_thermostat: debug

# If you need to debug uncomment the line below (doc: https://www.home-assistant.io/integrations/debugpy/)
# debugpy:
#   start: true
#   wait: false

input_number:
  fake_target_sensor:
    name: Temperature
    min: 0
    max: 35
    step: 1
    icon: mdi:thermometer

input_boolean:
  fake_heater_switch:
    name: heater
    icon: mdi:heater

climate:
  - platform: generic_thermostat
    name: fake_thermostat
    heater: input_boolean.fake_heater_switch
    target_sensor: input_number.fake_target_sensor
    min_temp: 5
    max_temp: 35
    ac_mode: false
    cold_tolerance: 0.3
    hot_tolerance: 0.3
    initial_hvac_mode: "heat"
    precision: 0.5

  - platform: virtual_thermostat
    name: 1.etg-kontor-virtual-thermostat
    thermostat: climate.fake_thermostat
    target_sensor: input_number.fake_target_sensor
    initial_hvac_mode: heat
    precision: 0.5
    unique_id: 1.etg-kontor-virtual-thermostat
